<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rushil Decor</title>
    <link rel="canonical" href="/en/" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=/en/" />
    <script>
      (function () {
        var supported = ["en", "de", "pl", "lt", "lv", "et", "ru"];
        var wanted = (navigator.languages || [navigator.language || "en"])
          .map(function (tag) { return String(tag).slice(0, 2).toLowerCase(); })
          .filter(function (code) { return supported.indexOf(code) !== -1; })[0];
        location.replace("/" + (wanted || "en") + "/");
      })();
    </script>
  </head>
  <body><p>Continue to <a href="/en/">rushil.eu/en</a>.</p></body>
</html>
